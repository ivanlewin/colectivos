<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colectivos de Buenos Aires, cuadra por cuadra</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root {
    color-scheme: light;
    --surface:    #fcfcfb;
    --plane:      #f9f9f7;
    --ink:        #0b0b0b;
    --ink-2:      #52514e;
    --ink-muted:  #898781;
    --border:     rgba(11, 11, 11, 0.10);
    --hover:      rgba(11, 11, 11, 0.05);
    /* "Ninguna" es un estado, no el escalón más bajo de una magnitud: va en un
       neutro fuera de la rampa, para que no se lea como "unas pocas líneas". */
    --n0: #c3c2b7;
    /* Los cuatro escalones de magnitud: una sola tonalidad, claro -> oscuro. */
    --n1: #86b6ef;  --n2: #3987e5;  --n3: #1c5cab;  --n4: #0d366b;
    /* Líneas seleccionadas. Separado de toda la rampa (ΔE CVD 24,7). */
    --pick: #eb6834;
  }
  /* Los valores oscuros van declarados dos veces a propósito: el media query
     cubre la preferencia del sistema, y el scope [data-theme] cubre la
     elección explícita del botón, que tiene que poder ganarle en los dos
     sentidos. El :not() deja que un "claro" explícito le gane al sistema
     oscuro; el :where() mantiene el media query por debajo en especificidad. */
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface:   #1a1a19;
      --plane:     #0d0d0d;
      --ink:       #ffffff;
      --ink-2:     #c3c2b7;
      --ink-muted: #898781;
      --border:    rgba(255, 255, 255, 0.10);
      --hover:     rgba(255, 255, 255, 0.07);
      --n0: #52514e;
      --n1: #184f95;  --n2: #2a78d6;  --n3: #6da7ec;  --n4: #cde2fb;
      --pick: #d95926;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface:   #1a1a19;
    --plane:     #0d0d0d;
    --ink:       #ffffff;
    --ink-2:     #c3c2b7;
    --ink-muted: #898781;
    --border:    rgba(255, 255, 255, 0.10);
    --hover:     rgba(255, 255, 255, 0.07);
    --n0: #52514e;
    --n1: #184f95;  --n2: #2a78d6;  --n3: #6da7ec;  --n4: #cde2fb;
    --pick: #d95926;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--plane);
  }
  #map { position: absolute; inset: 0; }

  #panel {
    position: absolute;
    top: 12px; left: 12px;
    width: 300px;
    max-height: calc(100% - 24px);
    overflow-y: auto;
    z-index: 1;
    padding: 14px 16px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.10);
  }
  .panel-head { display: flex; align-items: flex-start; gap: 10px; }
  h1 { flex: 1; margin: 0 0 2px; font-size: 15px; font-weight: 600; }
  .sub { margin: 0 0 14px; color: var(--ink-2); font-size: 12px; }

  #theme-btn {
    flex: none;
    display: grid; place-items: center;
    width: 28px; height: 28px; margin: -3px -4px 0 0;
    color: var(--ink-2);
    background: none; border: 1px solid transparent; border-radius: 5px;
  }
  #theme-btn:hover { color: var(--ink); background: var(--hover); }
  #theme-btn:focus-visible { outline: 2px solid var(--pick); outline-offset: 1px; }

  .field-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 8px; margin-bottom: 5px;
  }
  .field-head label { font-size: 12px; color: var(--ink-2); }

  button { font: inherit; color: inherit; cursor: pointer; }
  .linkish {
    padding: 0; background: none; border: 0;
    font-size: 12px; color: var(--ink-2); text-decoration: underline;
    text-underline-offset: 2px;
  }
  .linkish:hover { color: var(--ink); }

  /* ---- selector múltiple ---- */
  .picker { position: relative; }
  #picker-btn {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    width: 100%; padding: 6px 8px; text-align: left;
    background: var(--surface); border: 1px solid var(--border); border-radius: 5px;
  }
  #picker-btn[aria-expanded="true"] { border-color: var(--ink-muted); }
  #picker-btn svg { flex: none; opacity: 0.55; }

  #picker-pop {
    position: absolute; z-index: 2; top: calc(100% + 4px); left: 0; right: 0;
    padding: 6px;
    background: var(--surface);
    border: 1px solid var(--border); border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.16);
  }
  #picker-pop[hidden] { display: none; }
  #picker-search {
    width: 100%; padding: 5px 8px; margin-bottom: 4px;
    font: inherit; color: var(--ink);
    background: var(--plane);
    border: 1px solid var(--border); border-radius: 4px;
  }
  #picker-list { max-height: 210px; overflow-y: auto; }

  .opt {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 7px; border-radius: 4px;
    cursor: pointer; user-select: none;
  }
  .opt:hover, .opt.cursor { background: var(--hover); }
  .opt input { margin: 0; accent-color: var(--pick); }
  .opt .num {
    min-width: 2.4em; font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .opt .meta { margin-left: auto; font-size: 12px; color: var(--ink-muted); }
  .empty { padding: 8px 7px; font-size: 12px; color: var(--ink-muted); }

  #pick-info {
    margin: 8px 0 0; min-height: 1.45em;
    font-size: 12px; color: var(--ink-2);
  }
  #pick-info b { color: var(--ink); font-weight: 600; }

  .section { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
  .section h2 { margin: 0 0 9px; font-size: 12px; font-weight: 600; color: var(--ink-2); }

  .legend-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .swatch { flex: none; width: 22px; border-radius: 2px; }
  .legend-row span { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .legend-gap { height: 6px; }

  footer { margin-top: 16px; font-size: 11px; line-height: 1.5; color: var(--ink-muted); }
  footer a { color: inherit; }

  .maplibregl-popup-content {
    padding: 10px 12px;
    font: 13px/1.45 system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .maplibregl-popup-tip { border-top-color: var(--surface) !important; }
  .pop-street { font-weight: 600; margin-bottom: 1px; }
  .pop-alt { color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .pop-meta { color: var(--ink-muted); font-size: 12px; margin-bottom: 6px; }
  .pop-lines { color: var(--ink-2); font-size: 12px; font-variant-numeric: tabular-nums; }
  .pop-none { color: var(--ink-muted); font-size: 12px; font-style: italic; }
</style>
<script>
  // Se aplica antes de pintar nada: si no, al recargar con un tema elegido a
  // mano se ve un parpadeo del tema del sistema.
  try {
    var saved = localStorage.getItem('theme');
    if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
  } catch (e) { /* localStorage bloqueado: queda el tema del sistema */ }
</script>
</head>
<body>

<div id="map"></div>

<div id="panel">
  <div class="panel-head">
    <h1>Colectivos, cuadra por cuadra</h1>
    <button id="theme-btn" type="button"></button>
  </div>
  <p class="sub">31.961 cuadras de la Ciudad, con las líneas que pasan por cada una.</p>

  <div class="field-head">
    <label id="picker-label-el" for="picker-btn">Recorridos</label>
    <button id="toggle-all" class="linkish" type="button">Seleccionar todas</button>
  </div>

  <div class="picker">
    <button id="picker-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
      <span id="picker-value">Ninguna línea</span>
      <svg width="11" height="7" viewBox="0 0 11 7" aria-hidden="true">
        <path d="M1 1l4.5 4.5L10 1" fill="none" stroke="currentColor" stroke-width="1.6"/>
      </svg>
    </button>
    <div id="picker-pop" hidden>
      <input id="picker-search" type="text" inputmode="numeric"
             placeholder="Escribí un número: 145" autocomplete="off" aria-label="Buscar línea">
      <div id="picker-list" role="listbox" aria-multiselectable="true"></div>
    </div>
  </div>

  <p id="pick-info"></p>

  <div class="section">
    <h2>Líneas que pasan por la cuadra</h2>
    <div id="legend"></div>
  </div>

  <footer>
    Recorridos y paradas: GTFS de
    <a href="https://data.buenosaires.gob.ar/dataset/colectivos-gtfs-frequency">Buenos Aires Data</a>
    (2019). Callejero y padrón de líneas: Gobierno de la Ciudad, 2026.
    Hacé clic en cualquier cuadra para ver el detalle.
  </footer>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
// "ninguna" va aparte: es un estado, no el escalón más bajo de la escala. Por
// eso lleva un neutro y no participa de la rampa de azules.
const NONE_CLASS = { label: 'ninguna', varName: '--n0', width: 0.3, swatch: 1.5 };
const BREAKS = [
  { min: 1,  label: '1 a 2',    varName: '--n1', width: 0.8, swatch: 2 },
  { min: 3,  label: '3 a 5',    varName: '--n2', width: 1.3, swatch: 3 },
  { min: 6,  label: '6 a 10',   varName: '--n3', width: 1.9, swatch: 4 },
  { min: 11, label: '11 o más', varName: '--n4', width: 2.6, swatch: 5 },
];

const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

/* -------------------------------------------------------------------- tema */

// El botón cicla en este orden. Arranca en "system" mientras no haya nada
// guardado, así respeta la preferencia del sistema sin que nadie la elija.
const THEME_MODES = ['light', 'dark', 'system'];
const THEME_LABEL = {
  light:  'Tema claro',
  dark:   'Tema oscuro',
  system: 'Según el sistema',
};
const THEME_ICON = {
  light: '<circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4' +
         'M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/>',
  dark:  '<path d="M20.5 14.6A8.6 8.6 0 1 1 9.4 3.5a6.7 6.7 0 0 0 11.1 11.1z"/>',
  system: '<rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8.5 21h7M12 17v4"/>',
};

const darkMode = window.matchMedia('(prefers-color-scheme: dark)');

let themeMode = 'system';
try {
  const saved = localStorage.getItem('theme');
  if (THEME_MODES.includes(saved)) themeMode = saved;
} catch (e) { /* localStorage bloqueado */ }

const isDark = () => themeMode === 'dark' || (themeMode === 'system' && darkMode.matches);

const basemap = () => isDark()
  ? 'https://basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
  : 'https://basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';

function colorExpression() {
  const expr = ['step', ['get', 'n'], css(NONE_CLASS.varName)];
  for (const b of BREAKS) expr.push(b.min, css(b.varName));
  return expr;
}

// El grosor repite la misma escala que el color: codificación redundante a
// propósito, porque a escala de ciudad las 19.070 cuadras sin colectivo tapan
// todo y los corredores se tienen que leer sin distinguir tonos.
function widthExpression() {
  const atZoom = factor => {
    const expr = ['step', ['get', 'n'], NONE_CLASS.width * factor];
    for (const b of BREAKS) expr.push(b.min, b.width * factor);
    return expr;
  };
  return ['interpolate', ['linear'], ['zoom'],
    11, atZoom(1), 14, atZoom(2.2), 17, atZoom(6)];
}

const map = new maplibregl.Map({
  container: 'map',
  center: [-58.442, -34.615],
  zoom: 11.4,
  minZoom: 10,
  maxZoom: 18,
  // Guarda la posición en la URL, así se puede compartir una vista concreta.
  hash: true,
  style: {
    version: 8,
    sources: {
      base: {
        type: 'raster',
        tiles: [basemap()],
        tileSize: 256,
        attribution: '&copy; OpenStreetMap &copy; CARTO',
      },
    },
    layers: [{ id: 'base', type: 'raster', source: 'base' }],
  },
});

map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
map.addControl(new maplibregl.ScaleControl({ maxWidth: 90, unit: 'metric' }), 'bottom-right');

// Estado de la selección: códigos de línea con tres dígitos ("065").
const selected = new Set();
let allLines = [];

map.on('load', async () => {
  map.addSource('blocks', { type: 'geojson', data: 'data/blocks.geojson' });
  map.addSource('routes', { type: 'geojson', data: 'data/routes.geojson' });

  map.addLayer({
    id: 'blocks',
    type: 'line',
    source: 'blocks',
    paint: {
      'line-color': colorExpression(),
      'line-width': widthExpression(),
      'line-opacity': 0.9,
    },
  });

  // Las cuadras atribuidas a las líneas elegidas. Se dibujan gruesas y debajo
  // del recorrido para poder comparar: si la atribución está bien, la traza
  // cae justo encima de la banda.
  map.addLayer({
    id: 'blocks-picked',
    type: 'line',
    source: 'blocks',
    filter: ['boolean', false],
    paint: {
      'line-color': css('--pick'),
      'line-width': ['interpolate', ['linear'], ['zoom'], 11, 3, 14, 6, 17, 14],
      'line-opacity': 0.35,
    },
  });

  // El recorrido según el GTFS.
  map.addLayer({
    id: 'routes-picked',
    type: 'line',
    source: 'routes',
    filter: ['boolean', false],
    paint: {
      'line-color': css('--pick'),
      'line-width': ['interpolate', ['linear'], ['zoom'], 11, 1.4, 14, 2, 17, 3],
    },
    layout: { 'line-cap': 'round', 'line-join': 'round' },
  });

  // Capa invisible sólo para el clic: las cuadras sin colectivo se dibujan muy
  // finas y serían imposibles de acertar con el mouse.
  map.addLayer({
    id: 'blocks-hit',
    type: 'line',
    source: 'blocks',
    paint: { 'line-color': '#000', 'line-opacity': 0, 'line-width': 10 },
  });

  buildLegend();

  allLines = await fetch('data/lines.json').then(r => r.json());
  buildOptions(allLines);
  applySelection();

  // Detalle de una cuadra.
  const popup = new maplibregl.Popup({ closeButton: false, maxWidth: '260px' });
  map.on('click', 'blocks-hit', event => {
    const p = event.features[0].properties;
    const lines = p.l ? p.l.split(' ').map(Number).join(' · ') : '';
    popup.setLngLat(event.lngLat).setHTML(`
      <div class="pop-street">${p.s}${p.a ? ` <span class="pop-alt">${p.a}</span>` : ''}</div>
      <div class="pop-meta">${p.b || 'sin barrio asignado'} · ${p.t.toLowerCase()}</div>
      ${lines
        ? `<div class="pop-lines"><b>${p.n}</b> ${p.n === 1 ? 'línea' : 'líneas'}: ${lines}</div>`
        : '<div class="pop-none">No pasa ningún colectivo</div>'}
    `).addTo(map);
  });
  map.on('mouseenter', 'blocks-hit', () => { map.getCanvas().style.cursor = 'pointer'; });
  map.on('mouseleave', 'blocks-hit', () => { map.getCanvas().style.cursor = ''; });
});

/* ---------------------------------------------------------------- selector */

const pickerBtn = document.getElementById('picker-btn');
const pickerPop = document.getElementById('picker-pop');
const pickerSearch = document.getElementById('picker-search');
const pickerList = document.getElementById('picker-list');
const pickerValue = document.getElementById('picker-value');
const toggleAll = document.getElementById('toggle-all');
const pickInfo = document.getElementById('pick-info');

function buildOptions(lines) {
  pickerList.innerHTML = '';
  for (const line of lines) {
    const row = document.createElement('div');
    row.className = 'opt';
    row.role = 'option';
    row.dataset.code = line.linea;
    // El texto visible es sólo el número, para poder tipearlo y encontrarlo.
    row.innerHTML =
      `<input type="checkbox" tabindex="-1" aria-hidden="true">` +
      `<span class="num">${Number(line.linea)}</span>` +
      `<span class="meta">${line.cuadras} cuadras</span>`;
    row.addEventListener('click', () => toggle(line.linea));
    pickerList.appendChild(row);
  }
}

function visibleOptions() {
  return [...pickerList.querySelectorAll('.opt')].filter(o => o.style.display !== 'none');
}

function toggle(code) {
  selected.has(code) ? selected.delete(code) : selected.add(code);
  applySelection();
}

function applySelection() {
  const codes = [...selected];

  for (const opt of pickerList.querySelectorAll('.opt')) {
    opt.querySelector('input').checked = selected.has(opt.dataset.code);
    opt.setAttribute('aria-selected', selected.has(opt.dataset.code));
  }

  if (map.getLayer('routes-picked')) {
    map.setFilter('routes-picked',
      codes.length ? ['in', ['get', 'linea'], ['literal', codes]] : ['boolean', false]);
    // `l` es la lista de líneas de la cuadra, separada por espacios. Los códigos
    // son siempre de tres dígitos, así que buscar el substring es exacto.
    map.setFilter('blocks-picked',
      codes.length ? ['any', ...codes.map(c => ['in', c, ['get', 'l']])] : ['boolean', false]);
  }

  if (codes.length === 0) {
    pickerValue.textContent = 'Ninguna línea';
    pickInfo.textContent = '';
  } else if (codes.length === 1) {
    const line = allLines.find(l => l.linea === codes[0]);
    pickerValue.textContent = `Línea ${Number(codes[0])}`;
    pickInfo.innerHTML = `Recorre <b>${line ? line.cuadras : '?'}</b> cuadras de la Ciudad.`;
  } else {
    pickerValue.textContent = `${codes.length} líneas`;
    const shown = codes.slice().sort().map(Number);
    const list = shown.length > 8
      ? shown.slice(0, 8).join(', ') + `… y ${shown.length - 8} más`
      : shown.join(', ');
    pickInfo.innerHTML = `Líneas ${list}.`;
  }

  toggleAll.textContent = codes.length ? 'Limpiar selección' : 'Seleccionar todas';
}

toggleAll.addEventListener('click', () => {
  // Un solo botón con dos sentidos: si hay algo elegido limpia, si no, marca
  // todo. Se decide por el estado, no por el texto del botón.
  const hadSelection = selected.size > 0;
  selected.clear();
  if (!hadSelection) for (const line of allLines) selected.add(line.linea);
  applySelection();
});

function openPicker(open) {
  pickerPop.hidden = !open;
  pickerBtn.setAttribute('aria-expanded', String(open));
  if (open) {
    pickerSearch.value = '';
    filterOptions('');
    pickerSearch.focus();
  }
}

pickerBtn.addEventListener('click', () => openPicker(pickerPop.hidden));

document.addEventListener('click', event => {
  if (!pickerPop.hidden && !event.target.closest('.picker')) openPicker(false);
});

function filterOptions(query) {
  const q = query.trim();
  let visible = 0;
  for (const opt of pickerList.querySelectorAll('.opt')) {
    // Se compara sin ceros a la izquierda: tipear "65" encuentra la 065.
    const hit = !q || String(Number(opt.dataset.code)).startsWith(q);
    opt.style.display = hit ? '' : 'none';
    opt.classList.remove('cursor');
    if (hit) visible++;
  }
  let empty = pickerList.querySelector('.empty');
  if (!visible) {
    if (!empty) {
      empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'No hay ninguna línea con ese número.';
      pickerList.appendChild(empty);
    }
  } else if (empty) {
    empty.remove();
  }
  const first = visibleOptions()[0];
  if (first) first.classList.add('cursor');
}

pickerSearch.addEventListener('input', () => filterOptions(pickerSearch.value));

pickerSearch.addEventListener('keydown', event => {
  const options = visibleOptions();
  const index = options.findIndex(o => o.classList.contains('cursor'));

  if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
    event.preventDefault();
    if (!options.length) return;
    const next = event.key === 'ArrowDown'
      ? Math.min(index + 1, options.length - 1)
      : Math.max(index - 1, 0);
    options.forEach(o => o.classList.remove('cursor'));
    options[next].classList.add('cursor');
    options[next].scrollIntoView({ block: 'nearest' });
  } else if (event.key === 'Enter') {
    event.preventDefault();
    if (options[index]) toggle(options[index].dataset.code);
  } else if (event.key === 'Escape') {
    openPicker(false);
    pickerBtn.focus();
  }
});

/* ----------------------------------------------------------------- leyenda */

function buildLegend() {
  const legend = document.getElementById('legend');
  legend.innerHTML = '';
  const row = cls => {
    const el = document.createElement('div');
    el.className = 'legend-row';
    el.innerHTML =
      `<div class="swatch" style="background:${css(cls.varName)};height:${cls.swatch}px"></div>` +
      `<span>${cls.label}</span>`;
    return el;
  };
  legend.appendChild(row(NONE_CLASS));
  // El corte visual separa el estado "ninguna" de la escala de magnitud.
  const gap = document.createElement('div');
  gap.className = 'legend-gap';
  legend.appendChild(gap);
  for (const b of BREAKS) legend.appendChild(row(b));
}

/* -------------------------------------------------------------- tema (UI) */

const themeBtn = document.getElementById('theme-btn');

function renderThemeButton() {
  const label = THEME_LABEL[themeMode];
  themeBtn.innerHTML =
    `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" ` +
    `stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">` +
    `${THEME_ICON[themeMode]}</svg>`;
  themeBtn.title = `${label} — clic para cambiar`;
  themeBtn.setAttribute('aria-label', label);
}

// El mapa base y los colores no salen del CSS: hay que reaplicarlos a mano
// cada vez que cambia el tema, porque MapLibre pinta sobre un canvas.
function repaintForTheme() {
  if (!map.getSource('base')) return;
  map.getSource('base').setTiles([basemap()]);
  if (map.getLayer('blocks')) {
    map.setPaintProperty('blocks', 'line-color', colorExpression());
    map.setPaintProperty('blocks-picked', 'line-color', css('--pick'));
    map.setPaintProperty('routes-picked', 'line-color', css('--pick'));
    buildLegend();
  }
}

function setTheme(mode) {
  themeMode = mode;
  if (mode === 'system') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = mode;
  try { localStorage.setItem('theme', mode); } catch (e) { /* bloqueado */ }
  renderThemeButton();
  repaintForTheme();
}

themeBtn.addEventListener('click', () => {
  const next = (THEME_MODES.indexOf(themeMode) + 1) % THEME_MODES.length;
  setTheme(THEME_MODES[next]);
});

// Si el tema quedó atado al sistema, hay que seguirlo cuando cambia.
darkMode.addEventListener('change', () => {
  if (themeMode === 'system') repaintForTheme();
});

renderThemeButton();
</script>
</body>
</html>
